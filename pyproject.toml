[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "lgcm"
version = "0.1.0"
requires-python = ">=3.12"
description = "Task-free continual dynamics learning with recurrent latent-context recall"
readme = "README.md"
license = "LicenseRef-LGCM-Proprietary"
license-files = ["LICENSE", "COMMERCIAL_LICENSE.md"]
authors = [{name = "Patrick Sims"}]
keywords = [
    "continual-learning",
    "concept-drift",
    "online-learning",
    "model-based-control",
    "research",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["numpy>=2.0"]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.11",
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]

[project.urls]
Repository = "https://github.com/thebrazenbeard/lgcm"
Issues = "https://github.com/thebrazenbeard/lgcm/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = ["--strict-config", "--strict-markers"]
filterwarnings = ["error"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src/lgcm"]
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.coverage.run]
source = ["lgcm"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = false
